
# BiteMenu v1.3 — Automated Testing
name: BiteMenu CI

# Run when code is pushed or a PR targets main.
on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

# This workflow only needs repository read access.
permissions:
  contents: read

jobs:
  test:
    name: JavaScript and Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Download our repository.
      - name: Checkout repository
        uses: actions/checkout@v6

      # Install Node.js.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      # Install dependencies from package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Install the browser for Playwright tests.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Check JavaScript files for syntax errors.
      - name: Check JavaScript syntax
        run: npm run check

      # Run the automated browser tests.
      - name: Run Playwright tests
        run: npm test

      # Upload reports for debugging.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
